name: End-to-end Tests

on:
  workflow_dispatch:
    inputs:
      options:
        description: 'Additional options for probe (e.g., --verbose)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yml'
  # The tests use no secrets, so they run on pull requests from forks and
  # Dependabot as well, with a read-only token.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yml'

# A newer push to a pull request supersedes the run in progress. Every other
# run gets a group of its own: a group holds one pending run at most, so a
# shared one would drop a push to main that was waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Run probe
      uses: mozership/probe-action@b3f365eba72bd5ab6f4cf003717a388752281f6c # v1.2.2
      # probe guide finds the latest release of an action with the REST API,
      # which allows a runner far fewer requests without a token. The token
      # of the run reads public repositories, from a fork too.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        path: e2e/test.yml
        options: ${{ github.event.inputs.options }}
