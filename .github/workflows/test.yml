name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request supersedes the run in progress. Every other
# run gets a group of its own, so that no push to main is skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Run test
      run: make test
    - name: Run db test without cgo, as releases are built
      run: go test ./internal/actions/db/...
      env:
        CGO_ENABLED: "0"
    - name: Run octocov
      uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    # golangci-lint fails on any issue, not only on those of the lines a
    # pull request changes.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
    # go fix rewrites code to what the Go version in go.mod has, such as
    # maps.Copy for a loop that copies a map. -diff prints the rewrites
    # instead of applying them, and fails when there is any: run go fix ./...
    # and commit what it changes.
    - name: go fix
      run: go fix -diff ./...

  # govulncheck fails on a vulnerability the code calls, in a module it
  # requires or in the standard library of the Go in go.mod, which releases
  # are built with: update the module, or the Go in go.mod.
  vuln:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Builds probe for every platform .goreleaser.yaml releases, the way it does,
  # so that a release does not fail on a platform the tests do not run on.
  # Each platform is a job of its own: a build takes over a minute, since the
  # cached build is the tests' and none of it is reused without cgo, and run
  # one after another they took longer than the tests.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Go build
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -o /dev/null ./cmd/probe
