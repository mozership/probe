name: OpenAPI Contract Example

vars:
  url: "{{URL ?? 'http://localhost:8080'}}"

jobs:
- name: "Check responses from {{vars.url}} against OpenAPI"
  defaults:
    http:
      url: "{{vars.url}}"
      # every request and response of the job is checked against the
      # document; the path is relative to the working directory
      # strict also fails a property the document does not declare
      openapi:
        spec: ./examples/fixtures/httpbin-openapi.yml
        strict: true
  steps:
  # the document checks the status and the body, so the test only says
  # what the document cannot
  - name: Get a UUID
    uses: http
    with:
      get: /uuid
    test: res.body.uuid != ""
  # the request is checked too: a body without a name would fail the step
  - name: Create a user
    uses: http
    with:
      post: /anything/users
      headers:
        content-type: application/json
      body:
        name: alice
    test: res.body.json.name == "alice"
  # a step can leave out the check for an endpoint the document does not cover
  - name: Echo a request
    uses: http
    with:
      get: /get
      openapi: false
    test: res.code == 200
