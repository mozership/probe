name: Authentication for Prod

steps:
- name: Get ID
  id: get_id
  uses: shell
  with:
    cmd: echo "prodbar"
  outputs:
    myid: trim(res.stdout)
  echo: |
    STDOUT: {{res.stdout}}
- name: Get token
  id: get_token
  uses: shell
  with:
    cmd: echo "secret!!!!!"
  outputs:
    mytoken: trim(res.stdout)
  echo: |
    STDOUT: {{res.stdout}}
- name: Hello
  uses: shell
  with:
    cmd: echo "Hello, {{ vars.id }} ({{ vars.testenv }})"
  echo: |
    STDOUT: {{res.stdout}}
