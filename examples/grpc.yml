name: gRPC API Examples
description: Examples for using the grpc action with gRPC Server

vars:
  addr: "{{GRPC_ADDR ?? 'localhost:50051'}}"
  service: "{{GRPC_SERVICE ?? 'UserService'}}"
  connect_addr: "{{CONNECT_ADDR ?? 'http://localhost:50061'}}"

jobs:
- name: "gRPC requests to {{vars.addr}}"
  defaults:
    grpc:
      addr: "{{vars.addr}}"
      service: "{{vars.service}}"
      tls: false
      timeout: 30s
      metadata:
        user-agent: probe-grpc/1.0
      # every request and response is checked against the .proto files,
      # rather than against the server's own reflection
      proto:
        files: [./actions/grpc/testserver/pb/user_service.proto]
        import_paths: [./actions/grpc/testserver/pb]
  steps:
  - name: Get User
    id: get_user
    uses: grpc
    with:
      method: GetUser
      body:
        user_id: "123"
    test: |
      res.status_code == "OK"
    echo: |
      User ID: {{res.body.user.id}}
    outputs:
      user_id: res.body.user.id
      user_name: res.body.user.name
  - name: Create User
    uses: grpc
    with:
      method: CreateUser
      body:
        user:
          name: Liny Ows
          email: linyows@example.com
          profile:
            age: 30
            location: Fukuoka
        preferences:
        - email_notifications
        - sms_notifications
      metadata:
        authorization: Bearer token123
    test: |
      res.status_code == "OK" &&
      res.body.user.name == "Liny Ows"
  - name: Update User
    uses: grpc
    with:
      method: UpdateUser
      body:
        user_id: "{{outputs.get_user.user_id}}"
        updates:
          email: linyows@example.org
    test: |
      res.status_code == "OK"
  - name: List Users with TLS
    uses: grpc
    with:
      addr: localhost:50052
      method: ListUsers
      tls: true
      insecure: true # Allow self-signed certificate for testing
      body:
        page_size: 10
        filter:
          active: "true"
      metadata:
        authorization: Bearer secure-token
    test: |
      res.status_code == "OK"
    echo: |
      Res: {{res.body}}
  - name: Watch Users
    uses: grpc
    with:
      method: WatchUsers
      body:
        count: 3
    test: res.status_code == "OK" && len(res.messages) == 3 && res.complete
  - name: Watch Users up to max_messages
    uses: grpc
    with:
      method: WatchUsers
      # 0 streams users until the call is left
      body:
        count: 0
      max_messages: 2
    test: len(res.messages) == 2 && !res.complete
  - name: Import Users
    uses: grpc
    with:
      method: ImportUsers
      # each item of the list is one message of the stream
      body:
      - name: Ada
      - name: Grace
    test: res.status_code == "OK" && res.body.imported == 2

# The same service called with the Connect protocol, over HTTP/1.1, as a
# connect-web client in a browser calls it.
- name: "Connect requests to {{vars.connect_addr}}"
  defaults:
    grpc:
      protocol: connect
      addr: "{{vars.connect_addr}}"
      service: "{{vars.service}}"
      timeout: 30s
  steps:
  - name: Get User as JSON, without .proto files
    uses: grpc
    with:
      method: GetUser
      body:
        userId: "123"
    test: res.status_code == "OK" && res.body.user.id == "123"
  - name: Get User as JSON, checked against .proto files
    uses: grpc
    with:
      method: GetUser
      body:
        user_id: "123"
      proto:
        files: [./actions/grpc/testserver/pb/user_service.proto]
        import_paths: [./actions/grpc/testserver/pb]
    test: res.status_code == "OK" && res.body.user.id == "123"
  - name: Get User as protobuf
    uses: grpc
    with:
      method: GetUser
      codec: proto
      body:
        user_id: "123"
      proto:
        files: [./actions/grpc/testserver/pb/user_service.proto]
        import_paths: [./actions/grpc/testserver/pb]
    test: res.status_code == "OK" && res.body.user.id == "123"
  - name: A user that does not exist
    uses: grpc
    with:
      method: GetUser
      body:
        userId: "999"
    test: res.status_code == "NOT_FOUND"
  - name: Watch Users over HTTP/1.1
    uses: grpc
    with:
      method: WatchUsers
      body:
        count: 3
      proto:
        files: [./actions/grpc/testserver/pb/user_service.proto]
        import_paths: [./actions/grpc/testserver/pb]
    test: res.status_code == "OK" && len(res.messages) == 3 && res.complete
  - name: Import Users over HTTP/1.1
    uses: grpc
    with:
      method: ImportUsers
      body:
      - name: Ada
      - name: Grace
      proto:
        files: [./actions/grpc/testserver/pb/user_service.proto]
        import_paths: [./actions/grpc/testserver/pb]
    test: res.status_code == "OK" && res.body.imported == 2
