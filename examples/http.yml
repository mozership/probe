name: REST API Example

vars:
  token: "{{TOKEN ?? 'secret'}}"
  url: "{{URL ?? 'http://localhost:8080'}}"

jobs:
- name: "Request to {{vars.url}}"
  defaults:
    http:
      url: "{{vars.url}}"
      headers:
        authorization: "Bearer {{vars.token}}"
        content-type: application/json
        accept: application/json
  steps:
  - name: Post
    id: hello
    uses: http
    with:
      post: /post
      body:
        message: hello
    test: |
      res.code == 200 &&
      res.body.json.message == "hello"
    echo: |
      IP: {{res.body.origin}}
    outputs:
      ip: res.body.origin
  - name: Get
    uses: http
    with:
      get: /get
    test: |
      res.code == 200 &&
      res.body.url == "http://localhost:8080/get"
  - name: Update
    uses: http
    with:
      put: /put
      body:
        ip: "{{outputs.hello.ip}}"
    test: |
      res.code == 200 &&
      res.body.json.ip == outputs.hello.ip
  - name: Patch
    uses: http
    with:
      patch: /patch
      body:
        message: yo
  - name: Delete
    uses: http
    with:
      delete: /delete
    test: |
      res.code == 200
  - name: Get an id
    id: tenant
    uses: http
    with:
      get: /uuid
    test: res.code == 200
    outputs:
      id: res.body.uuid
  # a key can be a template too, such as an id a previous step returned
  - name: Post with the id as a key
    uses: http
    with:
      post: /post
      headers:
        x-tenant-{{outputs.tenant.id}}: active
      body:
        type: status
        "{{outputs.tenant.id}}":
          active: true
    test: |
      res.code == 200 &&
      res.body.json[outputs.tenant.id].active == true &&
      any(keys(res.body.headers), lower(#) == "x-tenant-" + outputs.tenant.id)
