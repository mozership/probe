name: Repeat Literal Example

jobs:
- name: Job with repeat index
  repeat:
    count: 3
    interval: 2s
  steps:
  - name: Test repeat_index in echo - {{vars.name}}
    uses: shell
    with:
      cmd: echo "Name={{vars.name}} Index={{repeat_index}}"
    echo: |
      Current iteration: {{repeat_index}}
    wait: 500ms
    vars:
      name: repeat-{{repeat_index}}
  - name: Test repeat_index in test condition - {{vars.name}}
    uses: hello
    test: "repeat_index >= 1"
    wait: 500ms
    vars:
      name: Hello
  - name: Test repeat_index calculation - {{repeat_index}}
    uses: hello
    echo: |
      Calculated value: {{repeat_index * 10}}
    wait: 500ms
  - name: Per-iteration echo recorded in report
    uses: hello
    echo: |
      iteration {{repeat_index}}: token=tk-{{repeat_index * 7}}
    wait: 200ms

- name: Warm up before the runs counted
  repeat:
    count: 3
    warmup: 2
  steps:
  - name: Fails in the warmup runs alone
    uses: hello
    test: repeat_index >= 2

- name: Pass by the share of the runs
  repeat:
    count: 4
    warmup: 1
    test: steps.flaky.runs == 4 && steps.flaky.failure == 1 && steps.flaky.success_rate >= 0.75 && steps.flaky.rt.p95 < 5
  steps:
  - name: Fails in one run of four
    id: flaky
    uses: hello
    test: repeat_index != 2

- name: Fail by the share of the runs
  repeat:
    count: 3
    interval: 100ms
    async: true
    test: steps.strict.success_rate == 1
  steps:
  - name: Fails in one run of three
    id: strict
    uses: hello
    test: repeat_index != 1

- name: Compare to an earlier run
  repeat:
    count: 3
    # Skipped without --baseline, so the job passes by it.
    baseline_test: steps.compared.runs == baseline.steps.compared.runs && steps.compared.rt.p50 < baseline.steps.compared.rt.max + 1
  steps:
  - name: Takes about as long as before
    id: compared
    uses: hello
    test: res.status == 0
