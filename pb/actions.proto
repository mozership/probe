syntax = "proto3";
package pb;
option go_package = "./pb";

import "google/protobuf/struct.proto";

message RunRequest {
    reserved 1;
    reserved "args";
    google.protobuf.Struct with = 2;
    // The state the action left in the job before, for a stateful action.
    google.protobuf.Struct state = 3;
    // The step the action runs for.
    Step step = 4;
    // What the run allows the action to do, which the action keeps to.
    Guard guard = 5;
    // The names the workflow gives its external actions, each with the action
    // it stands for, for an action that runs steps of its own.
    map<string, string> actions = 6;
    // Whether the runner cleans up once the run is over: it calls Cleanup of
    // an action whose action.yml asks for it, and of the actions the response
    // names in cleanups.
    bool cleanup = 7;
}

// Guard is what the run allows actions to do, set by whoever runs probe
// rather than by the workflow. An action that keeps to it refuses what it
// does not allow; an empty guard allows everything.
message Guard {
    // Whether only what reads is allowed, and nothing that writes.
    bool read_only = 1;
    // The hosts actions may connect to, such as api.example.com,
    // localhost:8080 or *.internal; empty for any.
    repeated string allow_hosts = 2;
    // The actions run under the guard although they do not keep to it.
    repeated string allow_actions = 3;
    reserved 4;
    reserved "keeping";
    // The kinds of guard each action keeps to itself, such as read-only and
    // allow-host, keyed by the action as a step's uses names it.
    map<string, GuardKinds> keeps = 5;
}

// GuardKinds are the kinds of guard an action keeps to.
message GuardKinds {
    repeated string kinds = 1;
}

// Step tells an action about the step it runs for, for it to use as it sees
// fit, such as to say where a request comes from.
message Step {
    // The run of probe, the same for every step of every job in it.
    string run_id = 1;
    string job_id = 2;
    string job_name = 3;
    // The position of the step in the job, from 0.
    int64 index = 4;
    // The id the step is given, or empty.
    string id = 5;
    string name = 6;
    // Which run of a repeated job, from 0.
    int64 repeat = 7;
    // Which attempt of a retried step, from 1.
    int64 attempt = 8;
}

message RunResponse {
    reserved 2;
    reserved "error";
    google.protobuf.Struct result = 1;
    // The state the action leaves in the job, or none to keep it as it was.
    google.protobuf.Struct state = 3;
    // The external actions the action ran that are to be cleaned up once the
    // run is over, each as a step's uses names it in full, for an action that
    // runs steps of its own. A local action is an absolute path here.
    repeated string cleanups = 4;
}

// CleanupRequest tells an action that a run is over, for it to remove what
// its steps left behind in it.
message CleanupRequest {
    // The run of probe that is over, as each step of it was told in Step.
    string run_id = 1;
}

message CleanupResponse {}

service Actions {
    rpc Run(RunRequest) returns (RunResponse);
    // Cleanup is called once, after the last step of a run, on an action
    // whose action.yml sets cleanup, however many steps used it.
    rpc Cleanup(CleanupRequest) returns (CleanupResponse);
}
