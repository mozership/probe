version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: probe
    main: ./cmd/probe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Os }}_
      {{- if eq .Arch "386" }}i386
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - none*
checksum:
  name_template: 'checksums.txt'
# The cask is pushed to mozership/homebrew-tap, which is what
# `brew install mozership/tap/probe` reads. Pushing to another repository
# needs a token of its own; a release made without one skips the cask.
homebrew_casks:
  - name: probe
    binaries:
      - probe
    repository:
      owner: mozership
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://probe.linyo.ws
    description: End-to-end checks over HTTP, gRPC, SQL, mail and SSH from one YAML workflow
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary is not notarized, so macOS would refuse to run it as
    # downloaded. Homebrew reads {{staged_path}} itself, so it is written here
    # as a string for GoReleaser to leave alone.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "{{ "{{staged_path}}" }}/probe"], must_succeed: false
        end
      end
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
