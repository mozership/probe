name: Secret Masking of Cookies
description: |
  Sends a cookie and keeps the ones the server sets, so that e2e/test.yml can
  check that no cookie value appears in the output. Needs the httpbin server
  of e2e/test.yml.

jobs:
- name: Sends cookies
  defaults:
    http:
      url: http://localhost:8080
      keep_cookies: true
      headers:
        accept: application/json
  steps:
  - name: Sends a cookie the step gives
    uses: http
    with:
      get: /cookies
      cookies:
        token: e2e-given-cookie
    test: res.body.cookies.token == "e2e-given-cookie"
  # The value the server sets is in the URL, which is not hidden, so it is
  # encoded there and only its decoded form is checked.
  - name: Keeps a cookie the server sets
    uses: http
    with:
      get: /cookies/set?session=e2e-kept%2Dcookie
    test: res.cookies.session == "e2e-kept-cookie"
  - name: Sends the kept cookie
    uses: http
    with:
      get: /cookies
    test: res.body.cookies.session == "e2e-kept-cookie"
