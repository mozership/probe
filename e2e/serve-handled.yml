name: The test mail serve handled
description: |
  Run by e2e/test.yml after probe serve worked through the test mail of the
  mailbox: each is read, and the one that failed flagged.

actions:
  imap: github.com/mozership/probe-imap@c64e6ad9559de7a1405976fdaa11e7091bc732ee # v0.1.0

vars:
  host: "{{MAIL_HOST}}"
  port: "{{MAIL_PORT}}"
  user: "{{MAIL_USER}}"
  pass: "{{MAIL_PASS}}"

jobs:
- name: Mailbox
  steps:
  - name: The test mail is read, and the one that failed flagged
    uses: imap
    with:
      host: "{{vars.host}}"
      port: "{{vars.port}}"
      username: "{{vars.user}}"
      password: "{{vars.pass}}"
      tls: false
      commands:
      - name: select
        mailbox: INBOX
      - name: uid fetch
        sequence: "1:*"
        dataitem: (UID FLAGS ENVELOPE)
    test: |
      let mail = filter(res.data.fetch.messages, #.subject contains "serve-e2e");
      let flagged = filter(mail, "\\Flagged" in #.flags);
      res.code == 0 && len(mail) == 3 &&
      all(mail, "\\Seen" in #.flags) &&
      len(flagged) == 1 && flagged[0].subject contains "fail"
