name: Embedded credentials

# The job runs in a process of its own, and what reaches the run that embeds
# it is its report and its outputs, which carry the password here.
steps:
- name: Gives a password only this file knows
  id: give
  uses: hello
  with:
    password: e2e-embedded-password
  test: res.password != ""
  echo: "password was {{res.password}}"
  outputs:
    password_given: res.password
