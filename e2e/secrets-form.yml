name: Secret Masking in a Form
description: |
  Sends a password the workflow never declares in a form body, where it is
  percent-encoded, so that e2e/test.yml can check neither form of it appears
  in the output. Needs the httpbin server of e2e/test.yml.

jobs:
- name: Sends a form
  steps:
  - name: Sends a password in a form
    uses: http
    with:
      url: http://localhost:8080
      post: /post
      form:
        user: e2e
        # @, & and the space are percent-encoded in the body.
        password: "e2e-form p@ss&word"
    test: res.code == 200 && res.body.form.user == "e2e"
