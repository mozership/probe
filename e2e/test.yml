name: Verify All Examples
description: |
  This workflow validates the workflows under examples/*.
  The following software is required: go, docker, mysqladmin, pg_isready

vars:
  ci: "{{ CI ?? '' }}"
  report_dir: /tmp/probe-e2e-report
  mask_dir: /tmp/probe-e2e-mask

jobs:
# ------------------------------------------------------------------------
- name: Setup
  id: setup
  steps:
  - name: Go build
    uses: shell
    with:
      # needs cgo for go-sqlite3
      cmd: CGO_ENABLED=1 go build -ldflags="-s -w" -o probe ./cmd/probe/...
      timeout: 5m
    test: status == 0
  - name: Check the examples without running them
    uses: shell
    with:
      cmd: |
        for f in examples/*.yml; do
          case "$f" in examples/yaml-alias.yml|examples/yaml-shared.yml) continue ;; esac
          ./probe check "$f" > /dev/null || { echo "$f"; ./probe check "$f"; exit 1; }
        done
        ./probe check examples/yaml-shared.yml,examples/yaml-alias.yml > /dev/null
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: Pull httpbin images
    uses: shell
    with:
      cmd: docker pull kennethreitz/httpbin:latest
      timeout: 3m
    test: status == 0
  - name: Pull postgres images
    uses: shell
    with:
      cmd: docker pull postgres:16
      timeout: 3m
    test: status == 0
  - name: Pull mysql images
    uses: shell
    with:
      cmd: docker pull mysql:8.4
      timeout: 3m
    test: status == 0
  - name: Pull openssh images
    uses: shell
    with:
      cmd: docker pull linuxserver/openssh-server:version-10.2_p1-r0
      timeout: 3m
    test: status == 0
  - name: Pull mailpit images
    uses: shell
    with:
      cmd: docker pull axllent/mailpit:v1.28
      timeout: 3m
    test: status == 0
  - name: Pull greenmail images
    uses: shell
    with:
      cmd: docker pull greenmail/standalone:2.1.0
      timeout: 3m
    test: status == 0

# ------------------------------------------------------------------------
- name: Basic Workflow Tests
  id: basic
  needs: [setup]
  steps:
  - name: shell.yml
    uses: shell
    with:
      cmd: ./probe examples/shell.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: always-literal.yml (expected to fail, with the cleanup run)
    uses: shell
    with:
      cmd: ./probe examples/always-literal.yml; code=$?; test ! -e /tmp/probe-always-example || exit 99; exit $code
    test: res.code == 1 && res.stdout contains "Remove what the setup made"
    echo: "{{res.stdout}}"
  - name: defaults.yml
    uses: shell
    with:
      cmd: ./probe examples/defaults.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: fail.yml (expected to fail)
    uses: shell
    with:
      cmd: ./probe examples/fail.yml
    test: res.code == 1
    echo: "{{res.stdout}}"
  - name: realtime-print.yml
    uses: shell
    with:
      cmd: ./probe examples/realtime-print.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: retry-literal.yml
    uses: shell
    with:
      cmd: ./probe examples/retry-literal.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: skipif-literal.yml
    uses: shell
    with:
      cmd: ./probe examples/skipif-literal.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: echo-literal.yml
    uses: shell
    with:
      cmd: ./probe examples/echo-literal.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: timeout-literal.yml (expected to fail with an action error)
    uses: shell
    with:
      cmd: ./probe examples/timeout-literal.yml
    test: res.code == 3
    echo: "{{res.stdout}}"
  - name: needs-literal.yml (expected to fail)
    uses: shell
    with:
      cmd: ./probe examples/needs-literal.yml
    test: res.code == 1
  - name: truncate-print.yml
    uses: shell
    with:
      cmd: ./probe examples/truncate-print.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: outputs-literal.yml
    uses: shell
    with:
      cmd: ./probe examples/outputs-literal.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: yaml-shared.yml and yaml-alias.yml
    uses: shell
    with:
      cmd: ./probe examples/yaml-shared.yml,examples/yaml-alias.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: nested-alias.yml
    uses: shell
    with:
      cmd: ./probe examples/nested-alias.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: iteration-literal.yml
    uses: shell
    with:
      cmd: ./probe examples/iteration-literal.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: repeat-literal.yml (expected to fail)
    uses: shell
    with:
      cmd: ./probe examples/repeat-literal.yml
    test: res.code == 1
    echo: "{{res.stdout}}"
  - name: embedded-job.yml
    uses: shell
    with:
      cmd: ./probe examples/embedded-job.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: expr-functions.yml
    uses: shell
    with:
      cmd: ./probe examples/expr-functions.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: A missing workflow file is a configuration error
    uses: shell
    with:
      cmd: ./probe examples/does-not-exist.yml
    test: res.code == 2
  - name: An unknown flag is a configuration error
    uses: shell
    with:
      cmd: ./probe --no-such-flag examples/shell.yml
    test: res.code == 2
  - name: guide lists the topics
    uses: shell
    with:
      cmd: ./probe guide
    test: |
      res.code == 0 &&
      res.stdout contains "Usage: probe guide <topic>" &&
      res.stdout contains "concepts/expressions"
  - name: guide prints a page built into the binary
    uses: shell
    with:
      cmd: ./probe guide actions/http
    test: |
      res.code == 0 &&
      res.stdout startsWith "# HTTP Action"
  - name: skill install writes the skill built into the binary
    uses: shell
    with:
      cmd: |
        dir=$(mktemp -d)
        ./probe skill install "$dir/skills/probe" &&
          cmp "$dir/skills/probe/SKILL.md" skills/probe/SKILL.md && echo same
        rm -rf "$dir"
    test: |
      res.code == 0 &&
      res.stdout contains "Wrote " &&
      res.stdout contains "same"

# ------------------------------------------------------------------------
- name: Report File Tests
  id: report
  needs: [setup]
  steps:
  - name: Prepare an empty output directory
    uses: shell
    with:
      cmd: rm -rf {{vars.report_dir}} && mkdir -p {{vars.report_dir}}/default {{vars.report_dir}}/precedence
    test: res.code == 0
  - name: report.yml writes every format (expected to fail with an action error)
    uses: shell
    with:
      cmd: ./probe e2e/report.yml --report json={{vars.report_dir}}/out/report.json,junit={{vars.report_dir}}/out/junit.xml,markdown={{vars.report_dir}}/out/report.md
    test: |
      res.code == 3 &&
      res.stdout contains "Report Files"
  - name: JSON holds the summary and every failure kind
    uses: shell
    with:
      cmd: cat {{vars.report_dir}}/out/report.json
    test: |
      let r = parse_json(res.stdout);
      let checks = r.jobs[0].steps;
      res.code == 0 &&
      r.name == "Report Files" &&
      r.status == "failed" &&
      r.summary.jobs.total == 3 && r.summary.jobs.failed == 2 && r.summary.jobs.skipped == 1 &&
      r.summary.steps.total == 8 && r.summary.steps.passed == 1 && r.summary.steps.failed == 5 &&
      r.summary.steps.skipped == 1 && r.summary.steps.untested == 1 &&
      checks[0].status == "passed" && checks[0].echo == "stdout was ok" &&
      checks[1].failure.kind == "assertion" && checks[1].test == "res.code == 1" &&
      checks[1].failure.request.cmd == "echo ok" && checks[1].failure.response.code == 0 &&
      checks[2].failure.kind == "test_type" &&
      checks[3].failure.kind == "test_error" &&
      checks[4].failure.kind == "action" && checks[4].failure.message contains "timed out" &&
      checks[5].status == "skipped" && checks[5].name == "Skipped" &&
      checks[6].status == "untested" &&
      r.jobs[1].id == "downstream" && r.jobs[1].status == "skipped" &&
      r.jobs[2].steps[0].status == "failed" &&
      r.jobs[2].steps[0].repeat.total == 3 && r.jobs[2].steps[0].repeat.failure == 1 &&
      r.jobs[2].steps[0].failure.kind == "assertion"
  - name: JUnit is well-formed XML with the expected totals
    uses: shell
    with:
      cmd: |
        python3 -c "import sys, xml.etree.ElementTree as E; E.parse(sys.argv[1])" {{vars.report_dir}}/out/junit.xml &&
        cat {{vars.report_dir}}/out/junit.xml
    test: |
      res.code == 0 &&
      res.stdout contains `<testsuites name="Report Files" tests="9" failures="2" errors="3" skipped="2"` &&
      res.stdout contains `<failure message="test evaluated to false: res.code == 1 (res.code = 0)" type="assertion">` &&
      res.stdout contains `type="action">` &&
      res.stdout contains `<skipped message="job skipped">` &&
      res.stdout contains `<failure message="1 of 3 iterations failed; the first: test evaluated to false: repeat_index != 1 (repeat_index = 1)" type="assertion">`
  - name: Markdown lists the jobs and every failed step
    uses: shell
    with:
      cmd: cat {{vars.report_dir}}/out/report.md
    test: |
      res.code == 0 &&
      res.stdout contains "**Failed** in " &&
      res.stdout contains "| Checks | failed | 1/7 |" &&
      res.stdout contains "| Downstream | skipped | 0/0 |" &&
      res.stdout contains "### Checks / 1. False test" &&
      res.stdout contains "### Checks / 4. Times out" &&
      res.stdout contains "### Repeated / 0. Fails on the second iteration"
  - name: PROBE_REPORT writes to the default file names
    uses: shell
    with:
      cmd: |
        root=$(pwd)
        cd {{vars.report_dir}}/default &&
        PROBE_REPORT=json,markdown "$root/probe" "$root/e2e/report.yml" >/dev/null 2>&1
        echo "exit=$?"
        ls
    test: |
      res.stdout contains "exit=3" &&
      res.stdout contains "probe-report.json" &&
      res.stdout contains "probe-report.md" &&
      !(res.stdout contains "probe-junit.xml")
  - name: --report takes precedence over PROBE_REPORT
    uses: shell
    with:
      cmd: |
        root=$(pwd)
        cd {{vars.report_dir}}/precedence &&
        PROBE_REPORT=markdown "$root/probe" "$root/e2e/report.yml" --report junit >/dev/null 2>&1
        echo "exit=$?"
        ls
    test: |
      res.stdout contains "exit=3" &&
      res.stdout contains "probe-junit.xml" &&
      !(res.stdout contains "probe-report.md")
  - name: An unwritable report is a configuration error but the others are written
    uses: shell
    with:
      cmd: |
        ./probe e2e/report.yml --report json={{vars.report_dir}}/default,markdown={{vars.report_dir}}/unwritable.md
        echo "exit=$?"
        test -s {{vars.report_dir}}/unwritable.md && echo "markdown written"
    test: |
      res.stdout contains "exit=2" &&
      res.stdout contains "markdown written" &&
      res.stderr contains "failed to create json report"
  - name: An unknown format is rejected before the run
    uses: shell
    with:
      cmd: ./probe e2e/report.yml --report html
    test: |
      res.code == 2 &&
      res.stderr contains "unknown report format: html" &&
      !(res.stdout contains "Report Files")
  - name: github-summary appends to the file it is given
    uses: shell
    with:
      cmd: |
        printf '## Earlier step\n' > {{vars.report_dir}}/summary.md
        ./probe e2e/report.yml --report github-summary={{vars.report_dir}}/summary.md >/dev/null 2>&1
        ./probe e2e/report.yml --report github-summary={{vars.report_dir}}/summary.md >/dev/null 2>&1
        cat {{vars.report_dir}}/summary.md
    test: |
      res.code == 0 &&
      res.stdout startsWith "## Earlier step\n\n# Report Files\n" &&
      len(split(res.stdout, "# Report Files\n")) == 3 &&
      res.stdout contains "### Checks / 1. False test"
  - name: github-summary outside GitHub Actions warns and does not change the exit code
    uses: shell
    with:
      cmd: env -u GITHUB_STEP_SUMMARY ./probe e2e/report.yml --report github-summary
    test: |
      res.code == 3 &&
      res.stderr contains "[WARN] GITHUB_STEP_SUMMARY is not set"
  - name: github-summary writes to the job summary of this run
    uses: shell
    skipif: vars.ci == ""
    with:
      cmd: |
        ./probe examples/shell.yml --report github-summary >/dev/null 2>&1
        echo "exit=$?"
        grep -q '^# Shell Action Examples$' "$GITHUB_STEP_SUMMARY" && echo found
    test: |
      res.stdout contains "exit=0" &&
      res.stdout contains "found"
  - name: Remove the output directory
    uses: shell
    with:
      cmd: rm -rf {{vars.report_dir}}
    test: res.code == 0

# ------------------------------------------------------------------------
- name: Secret Masking Tests
  id: mask
  needs: [setup]
  steps:
  # The value carries a quote and a backslash, which Go, JSON and the log
  # escape differently, so each escaped form has to be hidden as well.
  - name: secrets.yml hides the secret, the credential header and the passwords (expected to fail with an action error)
    uses: shell
    with:
      cmd: |
        rm -rf {{vars.mask_dir}}
        E2E_TOKEN='e2e-s3cr"et\v' ./probe e2e/secrets.yml --verbose --report json={{vars.mask_dir}}/report.json,junit={{vars.mask_dir}}/junit.xml,markdown={{vars.mask_dir}}/report.md
    test: |
      res.code == 3 &&
      res.stdout contains "Sends <secret:E2E_TOKEN>" &&
      res.stdout contains "stdout was <secret:E2E_TOKEN>" &&
      res.stdout contains "token=<secret:E2E_TOKEN>" &&
      res.stderr contains "<redacted>" &&
      !(res.stdout contains "e2e-s3cr") && !(res.stderr contains "e2e-s3cr") &&
      !(res.stdout contains "e2e-runtime-credential") && !(res.stderr contains "e2e-runtime-credential") &&
      !(res.stdout contains "e2e-imap-password") && !(res.stderr contains "e2e-imap-password") &&
      !(res.stdout contains "e2e-dsn-password") && !(res.stderr contains "e2e-dsn-password") &&
      !(res.stdout contains "e2e-long-token") && !(res.stderr contains "e2e-long-token") &&
      !(res.stdout contains "e2e-embedded-password") && !(res.stderr contains "e2e-embedded-password")
  - name: The report files hold none of them
    uses: shell
    with:
      cmd: cat {{vars.mask_dir}}/report.json {{vars.mask_dir}}/junit.xml {{vars.mask_dir}}/report.md
    test: |
      res.code == 0 &&
      res.stdout contains "<secret:E2E_TOKEN>" &&
      !(res.stdout contains "e2e-s3cr") &&
      !(res.stdout contains "e2e-runtime-credential") &&
      !(res.stdout contains "e2e-imap-password") &&
      !(res.stdout contains "e2e-dsn-password") &&
      !(res.stdout contains "e2e-long-token") &&
      !(res.stdout contains "e2e-embedded-password")
  - name: Remove the output directory
    uses: shell
    with:
      cmd: rm -rf {{vars.mask_dir}}
    test: res.code == 0

# ------------------------------------------------------------------------
- name: HTTP Server Start
  id: http_server
  needs: [setup]
  steps:
  - name: Cleanup old HTTP container
    uses: shell
    with:
      cmd: docker stop probe-httpbin 2>/dev/null || true
    test: status == 0
  - name: Start HTTP server in background
    uses: shell
    with:
      background: true
      #cmd: go run github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@latest -host 127.0.0.1 -port 8080
      cmd: "docker run --rm -p 8080:80 --name probe-httpbin kennethreitz/httpbin:latest"
    test: status == -1
    outputs:
      http_pid: res.pid
      http_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: Wait for HTTP server to be ready
    uses: http
    with:
      url: http://localhost:8080
      get: /get
    retry:
      max_attempts: 5
      interval: "1s"
      initial_delay: "2s"
    test: res.code == 200

- name: HTTP Workflow Tests
  id: http
  needs: [http_server]
  steps:
  - name: http.yml
    uses: shell
    with:
      cmd: ./probe examples/http.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: http-upload.yml
    uses: shell
    with:
      cmd: ./probe examples/http-upload.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: secrets-form.yml hides a password sent in a form, percent-encoded too
    uses: shell
    with:
      cmd: ./probe e2e/secrets-form.yml --verbose
    test: |
      res.code == 0 &&
      res.stderr contains "password=<redacted>" &&
      !(res.stdout contains "e2e-form") && !(res.stderr contains "e2e-form")
  - name: http-cookies.yml
    uses: shell
    with:
      cmd: ./probe examples/http-cookies.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: file-template.yml
    uses: shell
    with:
      cmd: ./probe examples/file-template.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: http-trace.yml
    uses: shell
    with:
      cmd: ./probe examples/http-trace.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: guard-http.yml refuses a write under --read-only
    uses: shell
    with:
      cmd: ./probe --read-only --allow-host localhost e2e/guard-http.yml
    test: |
      res.code == 2 &&
      res.stdout contains "refused: POST http://localhost:8080/post may write"
  - name: guard-http.yml refuses a host the run does not allow
    uses: shell
    with:
      cmd: ./probe --allow-host api.example.com e2e/guard-http.yml
    test: |
      res.code == 2 &&
      res.stdout contains "refused: the host localhost:8080 is not one the run allows"
  - name: http-openapi.yml
    uses: shell
    with:
      cmd: ./probe --report json=/tmp/probe-e2e-openapi.json examples/http-openapi.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: coverage of the document http-openapi.yml checked
    uses: shell
    with:
      cmd: ./probe coverage ./examples/fixtures/httpbin-openapi.yml /tmp/probe-e2e-openapi.json
    test: |
      res.code == 0 &&
      res.stdout contains "Operations: 2 of 2 checked (100.0%)"
    echo: "{{res.stdout}}"
  - name: contract-failure.yml fails what breaks an OpenAPI document, strictly too
    uses: shell
    with:
      cmd: ./probe e2e/contract-failure.yml
    test: |
      res.code == 1 &&
      res.stdout contains "missing property 'id'" &&
      res.stdout contains "missing property 'name'" &&
      res.stdout contains "property 'origin' is not declared in the schema"
  - name: secrets-cookies.yml hides the cookies given and kept
    uses: shell
    with:
      cmd: ./probe e2e/secrets-cookies.yml --verbose
    test: |
      res.code == 0 &&
      res.stderr contains "<redacted>" &&
      !(res.stdout contains "e2e-given-cookie") && !(res.stderr contains "e2e-given-cookie") &&
      !(res.stdout contains "e2e-kept-cookie") && !(res.stderr contains "e2e-kept-cookie")
  - name: Stop HTTP server
    uses: shell
    with:
      cmd: docker stop probe-httpbin
    test: status == 0

# ------------------------------------------------------------------------
- name: GRPC Servers Start
  id: grpc_server
  needs: [setup]
  steps:
  - name: Generate keys and protobuf
    uses: shell
    with:
      cmd: |
        ./e2e/gen.sh
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        cd actions/grpc/testserver && \
          protoc --go_out=. --go-grpc_out=. ./pb/user_service.proto
    test: res.code == 0
  - name: Start GRPC server in background
    uses: shell
    with:
      background: true
      cmd: go run actions/grpc/testserver/*.go -connect-port=50061
    test: status == -1
    outputs:
      grpc_pid: res.pid
      grpc_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: Start GRPC server (TLS) in background
    uses: shell
    with:
      background: true
      cmd: |
        go run actions/grpc/testserver/*.go -tls -port=50052 \
          -cert="./e2e/certs/server.crt" \
          -key="./e2e/certs/server.key"
    test: status == -1
    outputs:
      grpctls_pid: res.pid
      grpctls_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}

- name: GRPC Workflow Tests
  id: grpc
  needs: [grpc_server]
  steps:
  - name: grpc.yml
    uses: shell
    with:
      cmd: ./probe --report json=/tmp/probe-e2e-grpc.json examples/grpc.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: coverage of the .proto file grpc.yml checked
    uses: shell
    with:
      cmd: ./probe coverage ./actions/grpc/testserver/pb/user_service.proto /tmp/probe-e2e-grpc.json
    test: |
      res.code == 0 &&
      res.stdout contains "- UserService/DeleteUser" &&
      res.stdout contains "Operations: 6 of 7 checked (85.7%)"
    echo: "{{res.stdout}}"
  - name: grpc-contract-failure.yml fails a response that breaks its .proto files
    uses: shell
    with:
      cmd: ./probe e2e/grpc-contract-failure.yml
    test: |
      res.code == 1 &&
      res.stdout contains "is not encoded as int32 email"
  - name: Stop GRPC server
    uses: shell
    with: # Use Process Group ID
      cmd: "kill -TERM -{{ outputs.grpc_pid }}"
    test: status == 0
  - name: Stop GRPC server with TLS
    uses: shell
    with: # Use Process Group ID
      cmd: "kill -TERM -{{ outputs.grpctls_pid }}"
    test: status == 0

# ------------------------------------------------------------------------
- name: SQLite Workflow Tests
  id: sqlite
  needs: [setup]
  steps:
  - name: sqlite.yml
    uses: shell
    with:
      cmd: ./probe examples/sqlite.yml
    test: res.code == 0
    echo: "{{res.stdout}}"

# ------------------------------------------------------------------------
- name: Postgres Server Start
  id: postgres_container
  needs: [setup]
  steps:
  - name: Cleanup old PostgreSQL container
    uses: shell
    with:
      cmd: docker stop probe-postgres 2>/dev/null || true
    test: status == 0
  - name: Start PostgreSQL container
    uses: shell
    with:
      background: true
      cmd: |
        docker run --rm -p 15432:5432 --name probe-postgres --tmpfs /var/lib/postgres \
          -e POSTGRES_USER=probe -e POSTGRES_PASSWORD=password -e POSTGRES_DB=postgres postgres:16
    test: status == -1
    outputs:
      postgres_pid: res.pid
      postgres_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: Wait for PostgreSQL server to be ready
    uses: shell
    with:
      cmd: pg_isready -h 127.0.0.1 -p 15432 -U probe -d postgres -q
    retry:
      max_attempts: 15
      interval: "3s"
      initial_delay: "2s"
    test: res.code == 0

- name: PostgreSQL Workflow Tests
  needs: [postgres_container]
  id: postgres
  steps:
  - name: postgres.yml
    uses: shell
    with:
      cmd: |
        POSTGRES_PORT=15432 POSTGRES_USER=probe POSTGRES_PASS=password \
          ./probe examples/postgres.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: guard-db.yml keeps PostgreSQL read-only
    uses: shell
    with:
      cmd: |
        export DSN='postgres://probe:password@localhost:15432/postgres?sslmode=disable'
        ./probe e2e/guard-db-setup.yml > /dev/null || exit 1
        WRITE='WITH d AS (DELETE FROM probe_guard RETURNING *) SELECT count(*) FROM d' \
          ./probe --read-only --allow-host localhost e2e/guard-db.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: Stop PostgreSQL container
    uses: shell
    with:
      cmd: docker stop probe-postgres
    test: status == 0

# ------------------------------------------------------------------------
- name: MySQL Server Start
  id: mysql_container
  needs: [setup]
  steps:
  - name: Cleanup old MySQL container
    uses: shell
    with:
      cmd: docker stop probe-mysql 2>/dev/null || true
    test: status == 0
  - name: Start MySQL container
    uses: shell
    with:
      background: true
      cmd: |
        docker run --rm -p 13306:3306 --name probe-mysql --tmpfs /var/lib/mysql \
          -e MYSQL_ROOT_PASSWORD=password -e MYSQL_DATABASE=mysql mysql:8.4
    test: status == -1
    outputs:
      mysql_pid: res.pid
      mysql_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: Wait for MySQL server to be ready
    uses: shell
    with:
      cmd: MYSQL_PWD=password mysqladmin ping -uroot -h127.0.0.1 -P13306
    retry:
      max_attempts: 15
      interval: "3s"
      initial_delay: "2s"
    test: res.code == 0

- name: MySQL Workflow Tests
  needs: [mysql_container]
  id: mysql
  steps:
  - name: mysql.yml
    uses: shell
    with:
      cmd: |
        MYSQL_PORT=13306 MYSQL_PASS=password \
          ./probe examples/mysql.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: guard-db.yml keeps MySQL read-only
    uses: shell
    with:
      cmd: |
        export DSN='mysql://root:password@localhost:13306/mysql'
        ./probe e2e/guard-db-setup.yml > /dev/null || exit 1
        WRITE='EXPLAIN ANALYZE UPDATE probe_guard SET v = 2' \
          ./probe --read-only --allow-host localhost e2e/guard-db.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: Stop MySQL container
    uses: shell
    with:
      cmd: docker stop probe-mysql
    test: status == 0

# ------------------------------------------------------------------------
- name: SSH Server Start
  id: ssh_container
  needs: [setup]
  steps:
  - name: Cleanup old SSH container
    uses: shell
    with:
      cmd: docker stop probe-ssh 2>/dev/null || true
    test: status == 0
  - name: Generate SSH test key
    uses: shell
    with:
      cmd: |
        rm -rf ./e2e/ssh
        mkdir -p ./e2e/ssh
        ssh-keygen -t rsa -b 2048 -f ./e2e/ssh/test_key -N "" -C "probe-test"
        chmod 600 ./e2e/ssh/test_key
        chmod 644 ./e2e/ssh/test_key.pub
    test: res.code == 0
  - name: Start SSH container
    uses: shell
    with:
      background: true
      cmd: |
        docker run --rm -p 2222:2222 --name probe-ssh \
          -e PUID=1000 \
          -e PGID=1000 \
          -e USER_NAME=probe \
          -e SUDO_ACCESS=true \
          -e PUBLIC_KEY="$(cat ./e2e/ssh/test_key.pub)" \
          linuxserver/openssh-server:version-10.2_p1-r0
    test: status == -1
    outputs:
      ssh_pid: res.pid
      ssh_log: res.log
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: Wait for SSH server to be ready
    uses: shell
    with:
      cmd: |
        ssh -i ./e2e/ssh/test_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -p 2222 probe@127.0.0.1 "echo ready"
    retry:
      max_attempts: 30
      interval: "3s"
      initial_delay: "5s"
    test: res.code == 0

- name: SSH Workflow Tests
  needs: [ssh_container]
  id: ssh
  steps:
  - name: ssh.yml
    uses: shell
    with:
      cmd: |
        SSH_HOST=127.0.0.1 SSH_PORT=2222 SSH_USER=probe \
          SSH_KEY_FILE=./e2e/ssh/test_key \
          ./probe examples/ssh.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: A refused environment variable is warned about, by name only
    uses: shell
    with:
      cmd: |
        SSH_HOST=127.0.0.1 SSH_PORT=2222 SSH_USER=probe \
          SSH_KEY_FILE=./e2e/ssh/test_key \
          ./probe e2e/ssh-env.yml
    test: |
      res.code == 0 &&
      res.stderr contains "ssh server refused an environment variable" &&
      res.stderr contains "PROBE_E2E_REFUSED" &&
      !(res.stderr contains "should-not-arrive")
  - name: Stop SSH container
    uses: shell
    with:
      cmd: docker stop probe-ssh
    test: status == 0

