# ------------------------------------------------------------------------
- name: DNS Action Tests
  id: dns
  needs: [setup]
  steps:
  # The server answers for example.test, so the tests depend on no resolver
  # and on no name that someone else keeps. go run builds it first, which
  # the timeout allows for.
  - name: Start DNS server in background
    uses: shell
    with:
      background: true
      cmd: go run ./e2e/dns-server -addr 127.0.0.1:15353
      ready:
        log: listening on
      timeout: 2m
    test: status == -1
    outputs:
      dns_pid: res.pid
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: dns.yml
    uses: shell
    with:
      cmd: ./probe examples/dns.yml
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: dns.yml runs under --read-only and --allow-host
    uses: shell
    with:
      cmd: ./probe --read-only --allow-host 127.0.0.1:15353 examples/dns.yml
    test: res.code == 0
  - name: guard-dns.yml refuses a server the run does not allow
    uses: shell
    with:
      cmd: ./probe --allow-host 127.0.0.1 e2e/guard-dns.yml
    test: |
      res.code == 2 &&
      res.stdout contains "refused: the host 198.51.100.53:53 is not one the run allows"
  - name: Stop DNS server
    uses: shell
    with: # Use Process Group ID
      cmd: "kill -TERM -{{ outputs.dns_pid }}"

# ------------------------------------------------------------------------
- name: External Action Tests
  id: external
  needs: [setup]
  steps:
  # The action is downloaded from GitHub, but the endpoint it queries is an
  # echo server here, so a public API being down does not fail the tests.
  # go run builds the server first, which the timeout allows for.
  - name: Start echo server in background
    uses: shell
    with:
      background: true
      cmd: go run ./e2e/echo-server -addr 127.0.0.1:8091
      ready:
        log: listening on
      timeout: 2m
    test: status == -1
    outputs:
      echo_pid: res.pid
    echo: |
      PID: {{ res.pid }}
      Log: {{ res.log }}
  - name: external-action.yml downloads the action into an empty cache
    uses: shell
    with:
      cmd: |
        cache=$(mktemp -d)
        XDG_CACHE_HOME="$cache" ./probe e2e/external-action.yml
        code=$?
        rm -rf "$cache"
        exit $code
      timeout: 2m
    test: res.code == 0
    echo: "{{res.stdout}}"
  - name: An action pinned to a tag is refused
    uses: shell
    with:
      cmd: |
        dir=$(mktemp -d)
        cat > "$dir/tag.yml" <<'YAML'
        name: tag pin
        jobs:
        - name: tag
          steps:
          - uses: github.com/mozership/probe-graphql@v0.2.0
            with:
              url: http://127.0.0.1:8091/graphql
              query: "{ a }"
        YAML
        ./probe "$dir/tag.yml" 2>&1
        echo "exit=$?"
        rm -rf "$dir"
    test: |
      res.stdout contains "exit=2" &&
      res.stdout contains "full 40-character commit SHA"
  - name: Stop echo server
    uses: shell
    with: # Use Process Group ID
      cmd: "kill -TERM -{{ outputs.echo_pid }}"
    test: status == 0
