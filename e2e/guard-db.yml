name: A database under a guard

vars:
  dsn: "{{DSN}}"
  write: "{{WRITE}}"

jobs:
- name: Reads and hidden writes
  steps:
  - name: A read runs
    uses: db
    with:
      dsn: "{{vars.dsn}}"
      query: SELECT count(*) AS n FROM probe_guard
    test: res.code == 0 && res.rows[0].n == 1
  # A statement that reads by its first word but writes is refused by the
  # database itself, in the read-only transaction it runs in.
  - name: A hidden write is refused by the database
    uses: db
    with:
      dsn: "{{vars.dsn}}"
      query: "{{vars.write}}"
    test: res.code == 1 && lower(res.error) contains "read"
  - name: Nothing was written
    uses: db
    with:
      dsn: "{{vars.dsn}}"
      query: SELECT count(*) AS n FROM probe_guard WHERE v = 1
    test: res.code == 0 && res.rows[0].n == 1
