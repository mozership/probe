name: SSH Refused Environment Variable
description: |
  Sends an environment variable no sshd_config allows with AcceptEnv, so that
  e2e/test.yml can check Probe warns about it and the command still runs.

vars:
  host: "{{SSH_HOST ?? ''}}"
  port: "{{SSH_PORT ?? 22}}"
  user: "{{SSH_USER ?? ''}}"
  key_file: "{{SSH_KEY_FILE ?? '~/.ssh/id_rsa'}}"

jobs:
- name: Refused variable
  steps:
  - name: Runs without the refused variable
    uses: ssh
    with:
      host: "{{vars.host}}"
      port: "{{vars.port}}"
      user: "{{vars.user}}"
      key_file: "{{vars.key_file}}"
      strict_host_check: false
      cmd: echo "value=${PROBE_E2E_REFUSED:-unset}"
      env:
        PROBE_E2E_REFUSED: should-not-arrive
    test: res.code == 0 && res.stdout == "value=unset\n"
