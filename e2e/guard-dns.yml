name: DNS under a guard

vars:
  server: "{{DNS_SERVER ?? '127.0.0.1:15353'}}"

jobs:
- name: A server the run allows, and one it does not
  steps:
  - name: A query is sent to a server the run allows
    uses: dns
    with:
      name: example.test
      server: "{{vars.server}}"
    test: res.rcode == "NOERROR"
  - name: A query to another server is refused
    uses: dns
    with:
      name: example.test
      server: 198.51.100.53
    test: res.rcode == "NOERROR"
