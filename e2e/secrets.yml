name: Secret Masking
description: |
  Sends a declared secret, and a credential header and passwords the workflow
  never declares, so that e2e/test.yml can check none of them appears in the
  output or the report.
  This workflow is expected to fail with an action error.

secrets:
- E2E_TOKEN

vars:
  token: "{{E2E_TOKEN}}"

jobs:
- name: Uses a secret
  steps:
  - name: "Sends {{vars.token}}"
    uses: shell
    with:
      # Single quotes keep the value as it is, quotes and backslashes included.
      cmd: "printf '%s\\n' '{{vars.token}}'"
    test: res.code == 1
    echo: "stdout was {{res.stdout}}"
  - name: Sends a credential header to a closed port
    uses: http
    with:
      url: http://127.0.0.1:1
      get: "/?token={{vars.token}}"
      headers:
        authorization: Bearer e2e-runtime-credential
    test: res.code == 200
  - name: Sends a password to a closed port
    uses: imap
    with:
      host: 127.0.0.1
      port: 1
      username: e2e
      password: e2e-imap-password
      commands:
      - name: noop
    test: res.code == 0
  - name: Sends a password in a DSN to a closed port
    uses: db
    with:
      dsn: "postgres://e2e:e2e-dsn-password@127.0.0.1:1/e2e?sslmode=disable&connect_timeout=1"
      query: select 1
    test: res.code == 0
  # Longer than the 200 bytes an action's log truncates values to.
  - name: Sends a long token to a closed port
    uses: http
    with:
      url: http://127.0.0.1:1
      get: /
      headers:
        authorization: "Bearer e2e-long-token-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    test: res.code == 200
  - name: Runs a job that holds its own password
    uses: embedded
    with:
      path: e2e/secrets-embedded-job.yml
    test: res.code == 0
